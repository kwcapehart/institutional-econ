*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,summary:focus-visible,canvas[role="button"]:focus-visible{outline:3px solid #2784dc;outline-offset:3px}button:hover:not(:disabled){filter:brightness(.95)}
#app{min-height:100dvh;display:flex;flex-direction:column}.top{height:63px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 clamp(20px,3.6vw,58px);gap:16px}.brand{font-family:Georgia,serif;font-size:clamp(22px,2.2vw,30px);color:var(--navy);font-weight:600}.topcontrols{display:flex;align-items:center;gap:10px}.simplebtn{color:var(--navy);font-size:13px;font-weight:700;border:1px solid #ccc6c1;border-radius:99px;background:transparent;padding:10px 16px}.simplebtn.primary{background:var(--red);border-color:var(--red);color:white}.subtle{color:var(--mute);font-size:13px}
.journey{height:52px;padding:9px clamp(20px,3.6vw,58px);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}.stepdot{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid #d3c9c4;background:transparent;color:#686d73;font-size:12px;font-weight:700}.stepdot[aria-current="step"]{color:white;background:var(--navy);border-color:var(--navy)}.stepdot.visited:not([aria-current="step"]){border-color:var(--red)}
.stage{position:relative;display:grid;grid-template-columns:minmax(320px,43%) minmax(0,57%);min-height:calc(100dvh - 115px);max-width:1900px;margin:0 auto;width:100%;flex:1}.artframe{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:490px}.artimg{max-width:min(100%,720px);max-height:calc(100dvh - 145px);width:100%;object-fit:contain;pointer-events:none}.artnum{position:absolute;left:clamp(24px,4vw,70px);top:28px;color:#d1c3bb;font:italic 66px Georgia,serif;line-height:1}.info{position:absolute;bottom:32px;left:clamp(24px,4vw,70px);width:34px;height:34px;border-radius:50%;background:white;border:1px solid #b9aba3;color:var(--navy);font:italic bold 19px Georgia,serif;z-index:2}.artnote{position:absolute;bottom:76px;left:clamp(24px,4vw,70px);max-width:min(75%,390px);background:#fffdfa;border-left:3px solid var(--red);box-shadow:0 9px 29px #2222;padding:13px 16px;font-size:14px;line-height:1.45;z-index:2}
.right{padding:28px clamp(20px,5vw,80px) 45px clamp(22px,3vw,48px);height:calc(100dvh - 115px);min-height:500px;overflow-y:auto;overscroll-behavior:contain}.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--red)}.question{font:normal clamp(26px,2.42vw,39px)/1.17 Georgia,'Times New Roman',serif;color:var(--navy);margin:16px 0 26px;letter-spacing:-.015em}.choices{display:flex;flex-direction:column;gap:4px}.choice{display:flex;align-items:center;gap:13px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 4px 12px 0;width:100%;color:#323943;line-height:1.4}.choice:hover{background:#f2eee8}.choice.sel{background:#efeae4}.choice.correct{background:#e8f1ed}.choice.wrong{background:#fbe3e4;color:#982138}.choice.wrong .wording{color:#982138}.choice.wrong .letter{background:#bb1734;border-color:#bb1734;color:#fff}.letter{width:32px;height:32px;flex:none;border:1px solid #bbb2ad;border-radius:50%;display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:13px}.correct .letter{background:var(--good);color:white;border-color:var(--good)}.wording{font-size:clamp(15px,1.17vw,18px)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:23px 0 14px}.action{border:1px solid #c9bfba;background:white;color:var(--navy);font-size:13px;font-weight:750;border-radius:99px;padding:10px 16px}.action.open{background:var(--navy);border-color:var(--navy);color:white}.answer,.across{animation:appear .16s ease-out;border-top:1px solid #d9d2cb;padding-top:15px}.answerkey{font-size:14px;font-weight:800;color:var(--good);margin:2px 0 10px}.explainer{font-size:15px;line-height:1.5;margin-bottom:16px;color:#4a4d54}.cite-head{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#806e69;margin:15px 0 7px}.quotation{font-family:Georgia,serif;font-size:clamp(15px,1.21vw,18px);line-height:1.52;padding:13px 19px;margin:8px 0 15px;background:#f4eee6;border-left:3px solid var(--red);color:#282b35}.quotation strong{color:#0e2c4a;font-weight:750}.chlist{display:flex;flex-direction:column;gap:9px;padding-top:4px}.chtrigger{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #d3c9c0;background:#fffcf7;text-align:left;font-weight:800;color:var(--navy);font-size:14px;padding:14px 18px}.chtrigger span:last-child{font-size:18px}.chcontent{border-left:2px solid var(--red);margin:0 0 8px 14px;padding:13px 16px;background:#f7f1e9}.chapterconnections{margin-top:28px;border-top:1px solid #cfc6bd;padding-top:17px}.chapterconnections h3{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 14px}.chitem{margin:0 0 9px}.chitem summary{list-style:none;cursor:pointer;border:1px solid #d3c9c0;background:#fffcf7;font-weight:800;color:var(--navy);font-size:14px;padding:14px 18px;display:flex;justify-content:space-between}.chitem summary::-webkit-details-marker{display:none}.chitem summary::after{content:"+";font-size:19px;line-height:1}.chitem[open] summary::after{content:"−"}.chitem[open] summary{border-color:#bcae9f}.chitem .chcontent{margin:0 0 8px 14px;padding:13px 16px}.chcontent .quotation{padding:12px 14px;background:#fffdfa;font-size:15px;border-left:0;margin-bottom:0}.chcontent .cite-head{margin:12px 0 4px}.navfooter{display:flex;justify-content:space-between;align-items:center;margin:30px 0 0;gap:10px}.navbtn{border:0;background:transparent;color:var(--navy);font-size:13px;font-weight:800;padding:9px 0}.navcount{font-size:12px;color:#746e69}
#rollcall{position:fixed;left:0;top:115px;width:43vw;bottom:0;max-width:817px;z-index:30;display:none;justify-content:center;align-items:center;background:#faf6f0;box-shadow:9px 0 30px rgba(20,24,45,.16);padding:18px}#rollcall.show{display:flex}.rollpanel{width:100%;height:100%;position:relative;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:12px}.closewheel{position:absolute;right:0;top:0;background:white;border:1px solid #d1c6bd;border-radius:50%;font-size:23px;width:38px;height:38px;color:var(--navy)}.rollpanel canvas{cursor:pointer;touch-action:manipulation;width:min(100%,430px,calc(100dvh - 335px));aspect-ratio:1;height:auto;min-width:200px}.rollwinner{font:normal clamp(31px,3.5vw,52px)/1.05 Georgia,serif;color:var(--red);min-height:51px;text-align:center}.rollwinner.placeholder{color:#b2a79f}.rollstats{font-size:13px;color:#766e66;font-weight:700}.rollbuttons{display:flex;align-items:center;justify-content:center;gap:10px}.reset{border:0;background:none;color:#876d69;text-decoration:underline;font-size:12px}.used{font-size:11px;color:#7c7169;max-width:420px;max-height:50px;overflow:auto;text-align:center;line-height:1.35}.wheelstatus{font-size:12px;color:var(--red)}

@media(max-height:665px) and (min-width:741px){.right{padding-top:16px}.question{font-size:27px;margin:10px 0 17px}.choice{padding:8px 2px}.rollpanel canvas{width:min(100%,320px,calc(100dvh - 260px))}.rollpanel{gap:7px}.rollwinner{font-size:31px}}

<script>
const APP_DATA={"questions":[{"number":1,"stem":"Which statement best fits Elson's view of gendered power?","options":{"A":"Its unequal effects vary by class, but women cannot challenge them.","B":"Its economic effects differ by country because biology determines social roles.","C":"Its effects vary by class and place, while women retain some agency."},"point":"Gender is a changing structure of economic, social and political power. Its effects differ by class, race, and place; women are not a homogeneous group and retain agency.","answer":"C","id":"q1","mainQuotes":["My research is rooted in an understanding of gender as a structure of economic, social and political power that puts women and girls at a disadvantage compared to men and boys, power that is inscribed in the ownership and control of resources, the division of labour, laws, social norms, ideologies and everyday practices. It is intertwined with the structures of power of class and race, so that gender disadvantage is differentiated by class and race. It is also intertwined with structures of imperialism, colonialism and their legacies, so that gender relations differ across countries. The lives of women and girls are shaped in multiple ways by these structures of power, so that ‘women’ and ‘girls’ are not homogenous groups.","There is space for agency because gender as a structure of power is not solid, timeless and unmoving. It is a set of contradictory processes that while subordinating women, do change over time and can be challenged."],"across":[{"chapter":2,"summary":"Development may intensify, break down, and remake forms of gender subordination; women can organize to influence outcomes.","quote":"They argued that gender subordination takes many forms, and that new forms may be created as old ones fade away. For example, Elson and Pearson (1981) analysed female labour-intensive export-oriented industrialization, not as an inter-sectoral labour transfer, but as an interplay of conflicting tendencies: a tendency to intensify the existing forms of gender subordination; a tendency to decompose existing forms of gender subordination; and a tendency to recompose new forms of gender subordination. While policies to promote the expansion of employment in export factories did not in any simple way liberate women, the interplay of these tendencies opened up a space for women to act collectively to improve their conditions as wage workers and as members of household communities, and to build co-operation and solidarity between women.","lead":"On the Subordination of Women Group’s analysis of development and industrialization:"},{"chapter":3,"summary":"The women-in-development approach helped make gender relations visible but can treat women as homogeneous and leave relationships to men unexamined.","quote":"Books about women in development have been a necessary stage in making gender relations visible in the development process, but posing the issue in terms of women in development has several limitations. It facilitates the view that ‘women’, as a general category, can be added to an existing approach to analysis and policy, and that this will be sufficient to change development outcomes so as to improve women’s position. It facilitates the view that ‘women’s issues’ can be tackled in isolation from women’s relation to men. It may even give rise to the feeling that the problem is women rather than the disadvantages women face; and that women are unreasonably asking for special treatment rather than for redress for injustices and for removal of distortions which limit their capacities. It tends to encourage the treatment of women as a homogeneous group with the same interests and viewpoint everywhere. It is necessary to move on from ‘women in development’ to approaches that emphasise gender relations.","lead":"On why the “women in development” approach can obscure differences among women:"}],"artInfo":"Different-sized figures and intersecting marks evoke differences in social power."},{"number":2,"stem":"Why does Elson invoke Simone de Beauvoir's idea that one “becomes” a woman?","options":{"A":"Biological differences determine roles, while norms determine their labels.","B":"Socialization enforces gender norms, yet individuals retain some agency.","C":"Gender roles are freely chosen once childhood socialization is complete."},"point":"De Beauvoir helps Elson distinguish biological difference from the social processes that reward compliance with gender norms and punish resistance.","answer":"B","id":"q2","mainQuotes":["Biological differences play an important role, but they are not destiny.","As Simone de Beauvoir, the French existentialist philosopher and fierce supporter of anti-colonial struggles, wrote in her pioneering book, The Second Sex (published in French in 1949): “One is not born, but rather becomes, a woman” (Beauvoir de 2009: 293), referring to processes of socialisation that reward conformity with and internalisation of gendered social norms and punish resistance to these norms. Nevertheless, a woman still has a degree of agency: De Beauvoir’s analysis illuminates the ongoing tension between freedom and constraint in women’s lives."],"across":[{"chapter":5,"summary":"Subordination and social norms shape what people regard as possible and how they divide household work.","quote":"The experience of subordination inclines people to shape their preferences to what is available, rather than reach out for what they want. Social norms constrain the choices that people make about the division of labour in the family.","lead":"On how subordination and social norms can shape preferences and household choices:"},{"chapter":3,"summary":"Gender identity must be acquired; it is not simply determined by biological sex.","quote":"People are born biologically female or male, but have to acquire a gender identity.","lead":"Distinguishing biological sex from socially acquired gender identity:"}],"artInfo":"A figure surrounded by threads suggests social norms alongside an opening for agency."},{"number":3,"stem":"Why does Elson prefer using the term “male bias” (rather than “gender bias)?","options":{"A":"To name the male privilege that biased practices protect.","B":"To attribute gender inequality mainly to men's conscious hostility.","C":"To treat discrimination against women and men as equivalent problems."},"point":"Elson deliberately names male privilege. Male bias refers to structural asymmetry favoring men, not to the claim that all individual men are consciously hostile.","answer":"A","id":"q3","mainQuotes":["I did not mean that all men are biased against women, but that the process of development is biased in favour of men, drawing upon and reproducing gender asymmetries which cannot be reduced to differences in preferences and endowments, and which call for remedy.","It has now become commonplace to suggest that practices that appear to be gender-neutral are in fact biased, but the phrase that tends to be used is ‘gender-bias’ not ‘male bias’. The sanitised language has been a means to securing wider acceptance of the prevalence of bias but has not prevented a fierce backlash against women’s rights and equality in many, many countries in the last decade. Perhaps it is time to insist again on speaking of male bias operating in defence of male privilege, often behind a façade of protection for ‘family values’ and to insist that what we value are egalitarian families."],"across":[{"chapter":3,"summary":"Male bias operates through daily practices, theory, and policy, supported by the organization of livelihoods and childrearing.","quote":"The proximate causes of male bias in development outcomes can be analysed in terms of male bias in everyday attitudes and actions, in theoretical reasoning, and in public policy. The underlying supports of male bias are to be found in the particular ways in which getting a living is integrated with raising children."},{"chapter":5,"summary":"New institutions can reproduce male bias even when reforms are not explicitly designed to discriminate.","quote":"Even though the policy reforms may not be male-biased by design, they will be male-biased by omission.","lead":"Discussing policy reforms that create new markets, firms, and public-sector agencies:"}],"artInfo":"A tilted balance evokes the asymmetry built into institutions.","mainQuoteLeads":[null,"On why Elson now favors the more explicit term “male bias”:"]},{"number":4,"stem":"Why can male-biased macroeconomic policies fail even by their own standards?","options":{"A":"Households can freely adjust unpaid work without affecting production.","B":"Gendered constraints on labor can obstruct the policies' economic goals.","C":"Macroeconomic targets are independent of gender divisions in labor."},"point":"Male-biased macroeconomic policy can frustrate its own objectives because gendered divisions of paid and unpaid labor constrain how production adjusts.","answer":"B","id":"q4","mainQuotes":["The in-built male bias also means that the adjustment policies fail to achieve their own macroeconomic goals – increase of exports, reduction of budget deficits and balance of payments deficits. Gender inequality is a barrier to an unproblematic adjustment process in which paid labour is reallocated from production of goods which are not internationally tradable to those which are.","Measures that supposedly increase efficiency and productivity all too often transfer costs from the paid economy, where they show up in the national accounts, and the accounts of public agencies and private businesses, to the unpaid economy in households and communities, where most of the work is done by women."],"across":[{"chapter":4,"summary":"Gender barriers obstruct the labor reallocation structural adjustment assumes, while women may face added paid and unpaid work.","quote":"Gender barriers to the reallocation of labour are likely to mean unemployment for men displaced from non-tradable activities, and extra work for women as factory work is added to unpaid domestic work (Heyzer (1988a) suggests that this has happened in the Philippines). This extra work is not recognised because unpaid domestic labour is not counted as work.","lead":"On structural adjustment’s expected transfer of labor toward internationally traded production:"},{"chapter":6,"summary":"Conventional growth models treat labor as a nonproduced input and overlook its reproduction.","quote":"The simple Harrod–Domar model (like most growth models) takes labour for granted and treats it as a non-produced input into production that does not constrain growth (Walters 1995).","lead":"A parallel assumption in conventional economic growth models:"}],"artInfo":"A strained connection between a factory and household suggests a policy feedback.","mainQuoteLeads":["Discussing the IMF and World Bank structural-adjustment programmes examined in Chapter 4:",null]},{"number":5,"stem":"What does Elson's four-sector circular flow reveal about labor supply?","options":{"A":"Private employers directly purchase and maintain all the capabilities they need.","B":"Sustaining labor depends on nonmarket work and resources from several sectors.","C":"Households supply labor independently of public services and NGO activities."},"point":"Private production depends on labor power renewed through nonmarket work, income, and services across the private, public, NGO and household sectors.","answer":"B","id":"q5","mainQuotes":["The ability of money to mobilize labour power for ‘productive work’ (which produces goods and services for the market) depends on the operation of non-market social relations to mobilize labour power for ‘reproductive work’ (which provides goods and services needed to reproduce people on a daily and inter-generational basis) (see Chapter 5).","There are flows of labour from households to the NGO sector both via labour markets and volunteer networks. These flows are also gendered, shaped by gender norms and practices, and, most importantly, the people, largely women, whose unpaid care is critical for the reproduction of labour, do not typically own the labour they have reproduced. In a capitalist mixed economy the reproduction of people and the sale of their labour is not organised in the same way as the reproduction and sale of livestock. Such an economy cannot be coordinated by market forces alone."],"across":[{"chapter":5,"summary":"Monetized production and non-monetized reproductive work depend on each other, even though they are coordinated differently.","quote":"Nevertheless, neither can the monetary economy sustain itself without an input of unpaid labour, input shaped by the structure of gender relations. Male bias in gender relations means that the burdens of ‘reproductive work’ fall mainly on women. There is an interdependence between the economy of monetized production and the non-monetized ‘reproductive’ economy.","lead":"After explaining that unpaid reproductive work depends on money and material resources, Elson describes the reverse dependence:"},{"chapter":6,"summary":"Social reproduction sustains workers and their capabilities rather than supplying labor automatically.","quote":"What is left out of account is the process of social reproduction in which women invest time and money in the education and socialisation of children; and in nutrition and healthcare for both children and adults.","lead":"On what standard economic growth models leave out when they treat labor as an input:"}],"artInfo":"Four painted zones form a circular network of work and resources."},{"number":6,"stem":"What distinction does Elson make between capability depletion and capitalist crisis?","options":{"A":"Depletion harms people's well-being and therefore must always cause an immediate crisis of capital accumulation.","B":"Depletion can harm people's well-being but can never threaten capital accumulation.","C":"Depletion can harm people's well-being without necessarily stopping capital accumulation."},"point":"Depletion can injure people without causing an immediate capitalist crisis: firms might relocate, while deeper sustained depletion can eventually hinder accumulation.","answer":"C","id":"q6","mainQuotes":["The depletion of capabilities does not by itself necessarily create a crisis for the continuation of a capitalist mixed economy. Indeed, it could be argued to be an intrinsic aspect of such economies. If it leads to a shortage of labour for the private sector, then private sector production may simply move to other locations in other economies where there is an ample labour supply. However, if technological developments mean that the private sector increasingly wants healthy, educated labour, then deep and ongoing depletion will hinder capital accumulation."],"across":[{"chapter":4,"summary":"Depletion can damage people’s capabilities before the consequences appear in measured output.","quote":"women’s capacity for work is not infinitely elastic and breaking point may be reached. There may simply not be enough female labour time available to maintain the quality and quantity of human resources at its existing level. This may not have an immediate impact on the level and composition of gross national output, but in the longer run a deterioration in health, nutrition and education will have an adverse impact on output levels.","lead":"Rejecting the assumption that women’s unpaid work can absorb unlimited demands:"}],"artInfo":"A fading figure and a distant factory depict depletion and the mobility of production."},{"number":7,"stem":"What criterion does Elson favor for defining “social reproduction”?","options":{"A":"All goods people need, including commodities produced for profit.","B":"Only unpaid care performed within households and communities.","C":"Nonmarket social relations, including paid but nonmarket public services."},"point":"Elson prefers to define social reproduction by nonmarket relations of provisioning, including unpaid care, volunteer labor, and paid but nonmarket public care services.","answer":"C","id":"q7","mainQuotes":["If the definition is based on production both unpaid and paid of goods and services that are required for the reproduction of human beings on a daily and intergenerational basis, then there are no clear criteria for where to draw a line.","I prefer to delineate activities that form part of social reproduction in terms of social relations of production rather than use-values produced. Thus, I consider social reproduction to be a non-market sphere of social provisioning through work which is not driven by profit-seeking, including unpaid work in families and communities, organised unpaid volunteer work, and paid (but non-market work) in public services like health, education and care (Elson 2010: 203)."],"across":[{"chapter":2,"summary":"Unpaid reproductive work was crucial to feminist critiques of development, even when paid work was the focus.","quote":"Benería and Sen also criticized Boserup for ignoring the crucial significance of reproductive work, (that is, the unpaid work in households and communities that is necessary to reproduce the labour force and the social fabric) and the need to focus on changing the way that production and reproduction are articulated.","lead":"Here Chapter 2 uses the narrower term “reproductive work” for unpaid labor in households and communities:"},{"chapter":10,"quote":"The sphere of reproduction is a non-market sphere of social provisioning, supplying services directly concerned with the daily and intergenerational reproduction of people as human beings, especially through their care, socialization and education. It includes unpaid work in families and communities, organized unpaid volunteer work and paid (but non-profit) work in public services like health and education. It is in this sphere that the care essential for human well-being is created.","lead":"Chapter 10 calls this sphere “non-market” and describes its paid public-service work as “non-profit”:"}],"artInfo":"A clinic, a household and a volunteer figure depict alternative forms of provisioning."},{"number":8,"stem":"How can the dominance of finance affect social reproduction?","options":{"A":"It can restrict public spending and shift more provisioning onto indebted households.","B":"It can restrict public spending but relieve indebted households of unpaid care.","C":"It can shift household risks while leaving public budgets free of investor pressure."},"point":"Financial institutions and mobile asset owners constrain governments and debtors, shifting pressures onto less mobile households reliant on labor income, public provision, and unpaid work.","answer":"A","id":"q8","mainQuotes":["The wealthy rentier households own financial assets, managed by financial services companies, from which they derive a large part of their income. The majority of households own few financial assets and owe substantial debts to financial services companies. These net debtor households derive most of their income from work, not asset ownership. The wealthy rentier minority do very little unpaid work, instead paying for substitutes, such as domestic workers; and make very little use of public services, instead paying for private services. In contrast, the majority of households rely much more on unpaid work and also on public services.","Financial services companies, especially international financial service companies, exercise power over net debtor households, and also over governments who rely on selling government bonds to finance the gap between public expenditure and revenue from taxes.","If governments prioritise the interests of rentier households, their policies will be marked by deflationary bias and commodification bias, and there will inevitably be pressure on women in the majority of net-debtor households to act as provisioners of last resort, expanding, as far as they are able, their unpaid work."],"across":[{"chapter":7,"summary":"The international mobility of finance pressures states toward deflation and privatization.","quote":"Rentier households and off-shore financial institutions exert pressure for deflation and privatisation threatening to exit if their interests are not given priority.","lead":"On how the threat of moving financial assets can shape policy toward debtor households:"},{"chapter":8,"summary":"Trade-tax reductions and corporate-tax competition weaken public revenue.","quote":"The capacity of governments to raise many forms of revenue has been reduced. Trade liberalization cuts import duties and export taxes, key sources of revenue in many poor countries. Competition to attract multinational corporations and their highly paid executives leads to cuts in corporation and capital gains taxes; tax holidays and other exemptions; and to cuts in top rates of income tax.","lead":"On the ways trade liberalization and competition for investment can squeeze public revenue:"},{"chapter":10,"summary":"Under austerity, reduced public hospital provision in Greece required female relatives to supply additional care.","quote":"Cutbacks have reduced access to health care in some countries. For instance, in Greece, many public hospitals have been closed or merged and those that remain open lack staff and supplies. Lack of nursing staff in hospitals has led to female relatives being called upon to help nurse patients (Karamessini 2011).","lead":"On how austerity-related cuts to public care in Greece transferred nursing responsibilities to families:"}],"artInfo":"A financial building and a household are connected by a heavy transfer of burdens."},{"number":9,"stem":"What findings does Elson cite about investing in care rather than construction?","options":{"A":"Care creates many jobs but emits 30% more greenhouse gases for equal investment.","B":"Care creates many jobs and emits 30% less greenhouse gases for equal investment.","C":"Care emits 30% less greenhouse gases but has no wider productivity benefits."},"point":"Elson cites research that care investment can create good jobs while producing about 30 percent fewer greenhouse-gas emissions than equal investment in construction.","answer":"B","id":"q9","mainQuotes":["Investment in social infrastructure is capable of creating millions of good quality jobs (De Henau 2022). In the longer run such investment can improve productivity throughout the economy via channels such as increasing women’s labour force experience and attachment and increasing the capabilities of the next generation of workers (Onaren et al. 2022). Moreover, investing in the care sector is 30 per cent less polluting in terms of greenhouse gas emissions than investing the same amount in the construction sector (De Henau & Himmelweit 2020)."],"across":[{"chapter":6,"summary":"Growth requires social investment that reduces burdens on social reproduction.","quote":"A fully adequate co-ordination of production and social reproduction will require a transformation of the norms about what is ‘women’s work’ and ‘men’s work’ and a transformation of investors’ expectations not only about the future rate of growth of consumer demand, but also about the ways in which the sphere of production relates to the sphere of social reproduction. In down to earth terms, this means that firms will need to be transformed so that they do not penalise employees for undertaking domestic responsibilities and there will have to be social investment in providing the infrastructure and services required to reduce the burdens of social reproduction.","lead":"On why firms and public services must adapt to workers’ domestic responsibilities:"},{"chapter":9,"summary":"Investment in care and education can enable paid work and improve future capabilities.","quote":"UN Women has put forward a post-Covid plan for a sustainable and just economy, with improvements in care services at its centre. It argues that spending on care services should be treated as investment in social infrastructure and placed on a par with investment in physical infrastructure, recognising that both generate benefits that extend beyond the individual recipient to societies at large and into the future (UN Women 2021: 40–41). For instance, spending on high quality early childhood care and education in the short run enables mothers to undertake more paid work and improves the learning and well-being of children. It also creates more ‘decent jobs’ for women.","lead":"On the case for treating care services as social infrastructure with long-run benefits:"}],"artInfo":"Figures associated with care contrast with an industrial construction outline."},{"number":10,"stem":"Which dominant priorities does Elson argue must be “dethroned” in a green and caring economy?","options":{"A":"Public services, labor protections, participation, and social protection.","B":"Progressive taxation, democratic budgeting, public care, and capital controls.","C":"GDP, profit, fiscal-rule compliance, and unrestricted movement of money."},"point":"Elson calls for moving GDP, profit, fiscal-rule compliance, and unrestricted financial mobility from their dominant positions in economic decision-making.","answer":"C","id":"q10","mainQuotes":["To secure replenishment and regeneration we need to create green and caring economies that prioritise well-being rather than financial returns. This requires the creation of new development strategies that reorient our economies, dethroning GDP as the dominant indicator of success; change ownership models, dethroning pursuit of profit as the dominant objective; change the ways governments raise and spend money, dethroning compliance with fiscal rules as the dominant driver of decisions; and change the global financial system, dethroning free movement of money as the dominant operating principle (Elson 2024a)."],"across":[{"chapter":7,"summary":"Mobile investors can constrain democratic deliberation over finance.","quote":"Ironically the openness of capital markets is conducive to an absence of openness in policy discussion, for fear that the wrong signals will be sent and the volatile ‘sentiment’ of capital markets will be disturbed. It is difficult to conduct a participatory consultation on how to put financial policy at the service of social goals when some of the key players have no stake in the outcome beyond the next few hours.","lead":"On how capital-market openness can restrict democratic discussion of financial policy:"},{"chapter":8,"summary":"Fiscal democracy requires accountable, transparent, participatory budgeting.","quote":"To transform government budget-making so that it is fully consistent with gender equality and the empowerment of women requires the creation of fiscal democracy, a system in which budget processes are transparent, accountable and participatory, and in which every type of citizen has an equal voice (Bakker 2002).","lead":"On what a different approach to government budgeting would require:"},{"chapter":9,"summary":"The composition of output matters, not merely the rate of GDP growth.","quote":"Rather than simply looking at GDP growth as an indicator of prosperity, it is necessary to look at which kinds of outputs are growing, and which activities are taking place.","lead":"On why the rate of GDP growth alone is not a sufficient measure of prosperity:"}],"artInfo":"Four interrupted structures and new growth illustrate competing economic priorities."},{"number":11,"stem":"How does Elson assess the IMF's increased attention to gender equality?","options":{"A":"It has advanced gender analysis without fundamentally rethinking its loan conditions.","B":"It has revised loan conditions while largely avoiding gender analysis.","C":"It has combined gender research with ending austerity requirements."},"point":"Elson acknowledges growing IMF research and policy interest in gender but criticizes continued loan conditions and austerity priorities harmful to women in poverty.","answer":"A","id":"q11","mainQuotes":["Perhaps surprisingly there has been growing recognition of the relevance of gender equality to macroeconomy policy at the IMF. For more than ten years some economists at the IMF have been describing gender equality as a ‘macro-critical issue’, mainly on grounds that gender inequality (especially in the distribution of unpaid work) hinders women’s labour market participation and is thus a barrier to economic growth. In 2022 the IMF adopted a Gender Mainstreaming Strategy that calls for an intentional and systematic approach to integrating gender into macroeconomic policies to foster strong, sustainable, and inclusive growth (Goyal and Sahay 2023). IMF economists have published research on gender inequality, including in both paid and unpaid work; and gen-der equality has been addressed in some IMF operational work, such as in some of the regular Article IV reviews (annual consultations between the IMF and all member governments), and in advice on gender responsive budgeting (Elson 2024b).","However, as feminists have pointed out, none of this has provoked a rethink of the kinds of conditions that the IMF attaches to loans, which tend to be harmful to women, especially women living in poverty (Bürgisser 2019; Elson 2024b).","International financial institutions like the IMF and the World Bank have promoted their own version of gender responsive budgeting that focuses on public sector financial management and does not address the way that budgets in many countries are vehicles for austerity policies (Elson 2021)."],"across":[{"chapter":7,"summary":"The World Bank added social safeguards without reconsidering whether public-expenditure cuts were appropriate.","quote":"The resulting document ‘Managing the Social Dimensions of Crisis: Good Practices in Social Policy’ (World Bank 1999) exemplifies the ‘adding on’ approach. Although there is much reference to households and communities, there is no systematic analysis of the way in which the principles of social policy need to take into account the different (and disadvantaged) position of women in comparison to men; and to take into account unpaid care work in households and communities. The principles focus on cutting public expenditure in ways that will not worsen the position of the worst off, but pay little attention to the question of whether cutting public expenditure is the appropriate strategy.","lead":"Following the Asian financial crisis, the World Bank was asked to develop general social-policy principles. Elson criticizes the resulting document:"},{"chapter":8,"summary":"Elson explicitly calls for ending IMF pressure for severe expenditure cuts during financial crises.","quote":"In the realm of international finance, this means cancellation of debts of the Highly Indebted Poor Countries; no pressure from the IMF for countries to liberalize capital markets to permit financial investors to move money freely across borders; no pressure from the IMF for countries hit by financial crises to severely cut back on public expenditure; and the introduction of new systems for dealing with financial crises (Stiglitz 2002; Singh & Zammit 2000).","lead":"To protect governments’ ability to raise revenue and cushion their societies against economic shocks, Elson proposes:"}],"artInfo":"Two institutional ledgers are bridged by an incomplete stroke, suggesting reform in progress."},{"number":12,"stem":"Which of the following statements is NOT consistent with what Elson argues when discussing policies supporting the “care economy”?","options":{"A":"Tax breaks for parents who purchase childcare tend to benefit better-off women more.","B":"Cash payments encouraging mothers to stay home can reinforce unequal gender roles.","C":"Publicly funded care services can reduce unpaid work but cannot create decent paid jobs."},"point":"Public care can both reduce unpaid work and create decent paid jobs. Other “care economy” measures may mainly benefit advantaged households or reinforce existing roles.","answer":"C","id":"q12","mainQuotes":["The report emphasised the importance of investing in good quality accessible public care services not only to reduce unpaid care work but also to provide decent paid work for women and commissioned quantitative studies from feminist economists (ILO 2018).","The concept of the care economy is now widely used in policy discussions in international fora, such as the annual inter-governmental meetings of the UN Commission on the Status of Women. It is a more accessible concept than social reproduction but does not foreground the role of unpaid work in reproducing the labour supply and thus the economic system as a whole, benefiting not only those who receive care, but also those who make profits out of the capacities that care sustains. Moreover, as the concept of the care economy has become popular, the link to investment in good quality public services and jobs is often lost.","A range of other policies is now often considered as support for the care economy, including tax breaks for parents who pay for child-care services (which benefits better-off women much more than those with low incomes), and cash transfers to encourage mothers to stay at home to raise children (which supports rather than transforms existing unequal gender norms)."],"across":[{"chapter":7,"quote":"The third bias to be avoided is privatization bias. This occurs when public provision is judged less efficient than private provision on the basis of incomplete and faulty measures of efficiency, which do not take account of unpaid work and quality of provision.","lead":"On a related bias in judging public care services against private provision:"},{"chapter":9,"summary":"Public care can reduce unpaid work while producing decent paid care jobs.","quote":"For instance, spending on high quality early childhood care and education in the short run enables mothers to undertake more paid work and improves the learning and well-being of children. It also creates more ‘decent jobs’ for women.","lead":"On how accessible early-childhood services can affect both unpaid care and paid employment:"}],"artInfo":"A household and public care setting illustrate different ways of supporting care.","mainQuoteLeads":["Describing the ILO’s report on paid and unpaid care work:",null,null]},{"number":13,"stem":"What is Elson's ultimate assessment of adding gender variables to macroeconomic models?","options":{"A":"It is progress, but economic structures also need transforming.","B":"It is progress because it already transforms economic structures.","C":"It is a distraction from transforming economic structures."},"point":"Adding gender variables is a real advance, but Elson wants the economy understood and transformed as a gendered structure, rather than represented by merely adding a parameter.","answer":"A","id":"q13","mainQuotes":["Seguino (2021:348) concludes that ‘Twenty years ago, gender was not considered to be an important macroeconomic variable. Today it is.’ I agree with this conclusion but caution that we still face many challenges in getting economists, both orthodox and heterodox, to look at economies as gendered structures that need to be transformed, rather than simply adding a new variable to their equations."],"across":[{"chapter":5,"summary":"Markets and public institutions are organized by gendered norms rather than neutral individual choices.","quote":"At the meso-level, therefore, we can introduce gender analysis via an examination of how the social norms and networks which are needed for the successful operation of both commercial and public-service institutions are bearers of gender.","lead":"At the meso level, Elson argues that institutions themselves carry gendered norms:"},{"chapter":6,"summary":"Elson proposes changes in concepts, evidence, and institutions while engaging with and challenging conventional macroeconomics.","quote":"We shall have to work simultaneously on improving conceptual understanding, improving our empirical knowledge, and constructing a process of institutional change. This chapter is written in the belief that in doing all these things we shall have to act both ‘in’ and ‘against’ the established modes of macro-economic theory, empirical enquiry and policy processes. If we only work on the ‘inside’ we run the risk of merely achieving small improvements in the formulation of models or collection of statistics which do not actually transform women’s lives.","lead":"On why conceptual, empirical, and institutional change requires working both within and against conventional macroeconomics:"}],"artInfo":"Several economic model boxes connect imperfectly to a human figure."},{"number":14,"stem":"Why does Elson argue that economic transformation must go beyond the five Rs?","options":{"A":"The five Rs neglect paid care workers and need to incorporate their interests.","B":"Transformation must create caring economies that replenish people and the planet.","C":"Once the five Rs are adopted, economic transformation can focus solely on growth."},"point":"The five Rs are important but not an endpoint. Elson’s wider aim is caring economies that replenish and regenerate people and the planet.","answer":"B","id":"q14","mainQuotes":["The ILO produced a comprehensive report on care work, both unpaid and paid, which extended my 3R framework to a 5R framework to incorporate better rewards for paid care workers and representation of paid care workers in social dialogue and collective bargaining (ILO 2018).","That transformation needs to go beyond the principles embodied by the 5R’s framework to aim for the creation of caring economies that replenish and regenerate both people and planet (Elson 2024a).","To secure replenishment and regeneration we need to create green and caring economies that prioritise well-being rather than financial returns."],"across":[{"chapter":9,"summary":"Gender-equitable growth requires reorganization across production, social reproduction and finance.","quote":"This chapter has argued for an understanding of gender-equitable inclusive growth as a pattern and process of growth that ensures prosperity is shared between men and women in ways that reduce gender inequality through changes in the three spheres of the economy: production, social reproduction and finance. Gender-equitable inclusive growth means transforming the lives of men and women, so that they share unpaid domestic and care work on an equal basis, and women have an income of their own. These transformations should be achieved through equalising up, not equalising down.","lead":"On changes required across production, social reproduction, and finance—not only care provision:"},{"chapter":7,"summary":"The threat of investor exit impedes participatory financial policy; capital controls can create incentives for engagement.","quote":"It is difficult to conduct a participatory consultation on how to put financial policy at the service of social goals when some of the key players have no stake in the outcome beyond the next few hours. A neglected argument for some form of capital controls is to ensure that financial institutions have more incentive to engage in discussions with other social interests in the country whose financial instruments they have purchased, and to prevent them from foreclosing discussion by a pre-emptive exit (Elson & Çağatay 2000).","lead":"On why mobile financial investors can obstruct public participation, and how capital controls could help:"},{"chapter":8,"summary":"Transformative budgeting requires fiscal democracy, not only technical accounting.","quote":"To transform government budget-making so that it is fully consistent with gender equality and the empowerment of women requires the creation of fiscal democracy, a system in which budget processes are transparent, accountable and participatory, and in which every type of citizen has an equal voice (Bakker 2002).","lead":"On fiscal democracy and whose voices shape public budgets:"},{"chapter":10,"summary":"A crisis-free gender-equitable economy requires reorganizing relations among finance, production and reproduction.","quote":"Securing a sustainable crisis-free gender-equitable global economy requires a fundamental reorganization of the relations between the three spheres, so that finance and production serve the needs of reproduction, the sphere in which the care essential to human wellbeing is provided.","lead":"On the wider relationship among finance, production, and social reproduction:"}],"artInfo":"Five marks grow into a shared canopy, evoking a broader regenerative economy.","mainQuoteLeads":["On what the ILO added to the original three Rs:","After distinguishing gender-aware analysis from economic transformation:",null]}],"roster":["Adolfo","Arthur","Christian","Dragos","Elijah","Emmauel","G.","Gabriel","Georgia","Guadalupe","Hamzah","Isi","Ivy","Jacob","John","Kevin","Kobe","Lisa","Martin","Mervet","Mia","Michael","Noah","Oscar","Yahir"]};

function highlight(text,terms){if(!terms?.length)return esc(text);let positions=[];for(let term of terms){let i=text.indexOf(term);if(i>=0)positions.push([i,i+term.length]);}positions.sort((a,b)=>a[0]-b[0]);let out='',k=0;for(let [a,b] of positions){if(a<k)continue;out+=esc(text.slice(k,a))+'<strong>'+esc(text.slice(a,b))+'</strong>';k=b}return out+esc(text.slice(k));}
function pQuote(text,chapter,emphasis){return `<div class="cite-head">The Diane Elson Reader · Chapter ${chapter}</div><blockquote class="quotation">“${highlight(text,emphasis)}”</blockquote>`;}
function curr(){return Q[state.index]}
function go(i){let j=Math.max(0,Math.min(13,i));state.index=j;state.visited.add(j+1);render({preserveScroll:false});window.scrollTo(0,0);}
function journey(){
 let out='';
 Q.forEach(q=>{let n=q.number;out+=`<button class="stepdot ${state.visited.has(n)?'visited':''}" data-go="${n-1}" ${state.index===n-1?'aria-current="step"':''} aria-label="Question ${n}" title="Question ${n}">${n}</button>`});
 const nav=$('journey');nav.innerHTML=out;
 // Scroll the navigation rail only: scrollIntoView was also jumping the page itself.
 const active=nav.querySelector('[aria-current="step"]');
 if(active){let l=active.offsetLeft-nav.offsetLeft,r=l+active.offsetWidth;if(l<nav.scrollLeft)nav.scrollLeft=l-8;else if(r>nav.scrollLeft+nav.clientWidth)nav.scrollLeft=r-nav.clientWidth+8;}
}
function render({preserveScroll=true}={}){
 const prev=$('stage').querySelector('.right');
 const oldTop=preserveScroll&&prev?prev.scrollTop:0, oldPage=preserveScroll?window.scrollY:0;
 const q=curr(),n=q.number,rev=state.revealed.has(n),info=state.artInfo.has(n),selected=state.selected[n];journey();
 const choices=Object.entries(q.options).map(([key,value])=>`<button type="button" class="choice ${selected===key?'sel':''} ${rev&&q.answer===key?'correct':''} ${rev&&selected===key&&key!==q.answer?'wrong':''}" data-select="${key}" aria-pressed="${selected===key}"><span class="letter">${key}</span><span class="wording">${esc(value)}</span></button>`).join('');
 const chapters=`<div class="chapterconnections"><h3>Chapter connections</h3><div class="chlist">${q.across.map((entry,j)=>{
   const isOpen=state.expanded[n]?.has(j);
   return `<details class="chitem" data-chapter="${j}" ${isOpen?'open':''}><summary>Chapter ${entry.chapter}</summary><div class="chcontent">${entry.lead?`<p class="subtle">${esc(entry.lead)}</p>`:''}${pQuote(entry.quote,entry.chapter,connectionHighlights[n]?.[entry.chapter]||[])}</div></details>`;
 }).join('')}</div></div>`;
 const answer=rev?`<section class="answer" aria-label="Chapter 1 answer and evidence"><div class="answerkey">Best answer: ${q.answer}</div><div class="explainer">${esc(q.point)}</div>${q.mainQuotes.map((t,i)=>`${q.mainQuoteLeads?.[i]?`<p class="subtle">${esc(q.mainQuoteLeads[i])}</p>`:''}${pQuote(t,1,emphasized[n])}`).join('')}${chapters}</section>`:'';
 $('stage').innerHTML=`<div class="artframe"><div class="artnum">${String(n).padStart(2,'0')}</div><img class="artimg" src="${ART_ASSETS[String(n)]}" alt="Expressive conceptual artwork for question ${n}"><button type="button" class="info" data-info aria-label="Describe this artwork" aria-expanded="${info}">i</button>${info?`<div class="artnote">${esc(q.artInfo)}</div>`:''}</div><section class="right"><div class="label">Question ${n}</div><h1 class="question">${esc(q.stem)}</h1><div class="choices" role="group" aria-label="Answer choices">${choices}</div><div class="actions"><button type="button" class="action ${rev?'open':''}" data-reveal aria-expanded="${rev}">${rev?'Hide answer':'Reveal answer'}</button></div>${answer}<div class="navfooter"><button type="button" class="navbtn" data-prev ${n===1?'disabled':''}>← Previous</button><span class="navcount">${n} / 14</span><button type="button" class="navbtn" data-next ${n===14?'disabled':''}>Next →</button></div></section>`;
 const next=$('stage').querySelector('.right');if(next&&preserveScroll)next.scrollTop=oldTop;
 if(preserveScroll&&Math.abs(window.scrollY-oldPage)>1)window.scrollTo({top:oldPage,behavior:'instant'});
}
$('stage').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let n=curr().number;
 if(b.hasAttribute('data-select')){state.selected[n]=b.dataset.select;render()}
 else if(b.hasAttribute('data-info')){state.artInfo.has(n)?state.artInfo.delete(n):state.artInfo.add(n);render()}
 else if(b.hasAttribute('data-reveal')){state.revealed.has(n)?state.revealed.delete(n):state.revealed.add(n);render()}
 else if(b.hasAttribute('data-prev'))go(state.index-1)
 else if(b.hasAttribute('data-next'))go(state.index+1)
});
// Native details expand in place without redrawing the question or resetting scroll.
$('stage').addEventListener('toggle',e=>{const det=e.target;if(!det.matches?.('details.chitem'))return;
 const n=curr().number,j=Number(det.dataset.chapter);
 if(!state.expanded[n])state.expanded[n]=new Set();
 if(det.open)state.expanded[n].add(j);else state.expanded[n].delete(j);
},true);
$('journey').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(Number(b.dataset.go))});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}});
function safeRead(){try{const val=JSON.parse(localStorage.getItem('elson-discussion-roster-v2')||'null');if(!val||!Array.isArray(val.remaining)||!Array.isArray(val.used))return;let all=val.remaining.concat(val.used);if(all.length!==R.length||new Set(all).size!==R.length||all.some(x=>!R.includes(x)))return;state.remaining=val.remaining;state.used=val.used}catch(e){}}
function safeSave(){try{localStorage.setItem('elson-discussion-roster-v2',JSON.stringify({remaining:state.remaining,used:state.used}))}catch(e){}}
function intBelow(n){if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{window.crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}
const modal=$('rollcall'),canvas=$('wheel'),ctx=canvas.getContext('2d');
function drawWheel(pool,rotation){const size=520,r=232,cx=260,cy=260,n=pool.length;ctx.clearRect(0,0,size,size);ctx.save();ctx.translate(cx,cy);if(!n){ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.fillStyle='#e9e4da';ctx.fill();ctx.fillStyle='#13284c';ctx.textAlign='center';ctx.font='italic 26px Georgia';ctx.fillText('Complete',0,0);ctx.restore();return;}const arc=2*Math.PI/n,colors=['#eee7df','#e3e9e7','#f0e0df','#e6e0ee','#f1e9d9','#e2e6ed'];ctx.rotate(rotation);for(let i=0;i<n;i++){let st=i*arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,st,st+arc);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#2f343f44';ctx.lineWidth=1;ctx.stroke();ctx.save();ctx.rotate((i+.5)*arc);ctx.fillStyle='#13284c';ctx.textAlign='left';ctx.textBaseline='middle';let fs=n>22?14:n>14?15:n>7?18:23;ctx.font='bold '+fs+'px Arial';let name=pool[i],w=ctx.measureText(name).width;if(w>150)ctx.scale(150/w,1);ctx.fillText(name,77,0);ctx.restore()}ctx.beginPath();ctx.arc(0,0,57,0,2*Math.PI);ctx.fillStyle='#fffaf1';ctx.fill();ctx.strokeStyle='#13284c';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#c41230';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='italic 31px Georgia';ctx.fillText(String(n),0,0);ctx.restore();ctx.save();ctx.translate(cx,15);ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-15,-8);ctx.lineTo(15,-8);ctx.closePath();ctx.fillStyle='#c41230';ctx.fill();ctx.restore()}
function spinUI(){let left=state.remaining.length;$('rollstats').textContent=left+' / 25 left';$('spin').disabled=state.spinLocked||left===0;canvas.setAttribute('aria-disabled',String(state.spinLocked||left===0));$('spin').textContent=state.spinLocked?'Spinning…':'Spin';$('winner').textContent=state.winner||'—';$('winner').classList.toggle('placeholder',!state.winner);$('used').textContent=state.used.length?'Used: '+state.used.join(' · '):'';$('wheelstatus').textContent=state.spinLocked?'Selecting…':''}
function showSpin(){state.lastFocus=document.activeElement;state.displayPool=[...state.remaining];drawWheel(state.displayPool,state.wheelAngle);spinUI();modal.classList.add('show');modal.setAttribute('aria-hidden','false');$('spin').focus()}
function closeSpin(){if(state.spinLocked)return;modal.classList.remove('show');modal.setAttribute('aria-hidden','true');state.lastFocus?.focus?.()}
function spin(){if(state.spinLocked||!state.remaining.length)return;state.spinLocked=true;state.winner=null;let pool=[...state.remaining];state.displayPool=pool;let i=intBelow(pool.length),winner=pool[i],start=state.wheelAngle,arc=2*Math.PI/pool.length;let desired=-Math.PI/2-(i+.5)*arc;let normal=x=>((x%(2*Math.PI))+2*Math.PI)%(2*Math.PI),turn=normal(desired-start)+2*Math.PI*6;let duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1050;spinUI();function finish(){state.wheelAngle=start+turn;drawWheel(pool,state.wheelAngle);state.remaining.splice(state.remaining.indexOf(winner),1);state.used.push(winner);state.winner=winner;state.spinLocked=false;safeSave();spinUI()};if(!duration){finish();return}const t0=performance.now();function tick(now){let t=Math.min(1,(now-t0)/duration),eased=1-Math.pow(1-t,5);drawWheel(pool,start+turn*eased);if(t<1)requestAnimationFrame(tick);else finish()}requestAnimationFrame(tick)}
$('openroll').addEventListener('click',showSpin);$('closewheel').addEventListener('click',closeSpin);$('spin').addEventListener('click',spin);canvas.addEventListener('click',spin);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin();}});
$('resetroster').addEventListener('click',()=>{if(state.spinLocked)return;if(!confirm('Return all 25 names to the spinner?'))return;state.remaining=[...R];state.used=[];state.winner=null;state.wheelAngle=0;state.displayPool=[...R];safeSave();drawWheel(state.displayPool,0);spinUI()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show')){closeSpin();return}if(e.target.matches('input,textarea,[contenteditable]'))return;if(modal.classList.contains('show'))return;let k=e.key.toLowerCase();if(k==='n'||e.key==='ArrowRight')go(state.index+1);else if(k==='p'||e.key==='ArrowLeft')go(state.index-1);else if(k==='s')showSpin();else if(k==='e'){let n=curr().number;state.revealed.has(n)?state.revealed.delete(n):state.revealed.add(n);render()}});
safeRead();render();
})();
</script></body></html>
